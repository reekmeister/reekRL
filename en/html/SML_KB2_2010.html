{

    write("}\n");
    write("function ChhDelay(height)\n");
    write("{\n");
    write("   var  dataObj = document.getElementById(\"scroll\");\n");
    write("   dataObj.style.height = height-dataObj.offsetTop;\n");
    write("   dataObj.style.width = idTitle.clientWidth;\n");
    write("}\n");
    write("//-->\n");

    write("</td></tr></table>\n");
